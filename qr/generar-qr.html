<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow">
  <title>M &amp; A · Generador de QR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <style>
    .wrap { max-width: 720px; padding-top: 40px; }
    h1 { font-family: var(--serif); font-weight: 500; text-align: center; margin: 0 0 20px; }
    .preview { margin: 24px auto; max-width: 420px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
    .preview img { display: block; width: 100%; }
    .row { display: grid; gap: 12px; }
    .muted { color: var(--muted); font-size: 14px; text-align: center; }
    code { background: var(--sage-soft); padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Generador del código QR</h1>
    <form id="form" class="row">
      <div class="field">
        <label for="url">Dirección de la web (GitHub Pages)</label>
        <input id="url" type="url" required placeholder="https://tu-usuario.github.io/boda/">
      </div>
      <div class="field">
        <label for="key">Código secreto del evento (EVENT_KEY de Code.gs)</label>
        <input id="key" type="text" required placeholder="Ej.: MA2027flores">
      </div>
      <button class="btn btn-primary btn-big" type="submit">Generar QR</button>
    </form>
    <p class="muted" id="final"></p>
    <div class="preview" id="preview" hidden><img id="img" alt="Vista previa del QR"></div>
    <div class="row" id="downloads" hidden>
      <a id="dl-png" class="btn btn-primary" download="QR-boda-MA-05-06-2027.png">Descargar PNG (alta resolución)</a>
      <a id="dl-svg" class="btn btn-ghost" download="QR-boda-MA-05-06-2027.svg">Descargar SVG (vectorial)</a>
      <p class="muted">Escanéalo con tu móvil antes de imprimir para comprobar que abre la web.</p>
    </div>
  </main>

  <script src="qrcode.js"></script>
  <script src="qr-art.js"></script>
  <script>
  (function () {
    'use strict';
    var $ = function (id) { return document.getElementById(id); };
    var params = new URLSearchParams(location.search);
    if (params.get('url')) $('url').value = params.get('url');
    if (params.get('k')) $('key').value = params.get('k');

    $('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var base = $('url').value.trim();
      var key = $('key').value.trim();
      var u = new URL(base);
      u.searchParams.set('k', key);
      var finalUrl = u.toString();
      $('final').innerHTML = 'El QR abrirá: <code></code>';
      $('final').querySelector('code').textContent = finalUrl;

      var svg = await window.QRArt.buildSvg(finalUrl);
      var svgBlob = new Blob([svg], { type: 'image/svg+xml' });
      var svgUrl = URL.createObjectURL(svgBlob);
      $('dl-svg').href = svgUrl;
      $('img').src = svgUrl;
      $('preview').hidden = false;

      var png = await window.QRArt.svgToPng(svg, 4);
      $('dl-png').href = URL.createObjectURL(png);
      $('downloads').hidden = false;
      window.__qrDone = true;
    });

    if (params.get('auto')) $('form').requestSubmit();
  })();
  </script>
</body>
</html>
